name: Automated Workflow

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  automate-task:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Update from huma.ysepan.com
        id: crawler
        run: |
          python3 crawler_http.py --update >> "$GITHUB_OUTPUT"

      - name: Commit and push if there are changes
        env:
          TAG: ${{ steps.crawler.outputs.tag }}
        run: |
          git status --short
          if test -z "$(git status --porcelain)"; then
            echo "No changes"
            exit 0
          fi
          git config user.name "Automated"
          git config user.email "actions@users.noreply.github.com"
          DATE=$(date +"%Y-%m-%d")
          git add --all
          git commit --verbose -m "Automated update on $DATE"
          git check-ref-format "refs/tags/$TAG"
          if git rev-parse --verify --quiet "refs/tags/$TAG"; then
            echo "Tag already exists: $TAG" >&2
            exit 1
          fi
          git tag "$TAG"
          git push origin HEAD:master "refs/tags/$TAG"
